[package]
name = "baccy"
version = "0.4.0"
description = "BACnet Browser and Testing Tool"
authors = ["Baccy Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
if-addrs = "0.13"
serialport = { workspace = true }
dirs = { workspace = true }
hex = "0.4"
base64 = "0.22"
parquet = "58"
arrow-array = "58"
arrow-schema = "58"

# Baccy crates
baccy-core = { path = "../crates/baccy-core" }
baccy-app = { path = "../crates/baccy-app" }
baccy-protocol = { path = "../crates/baccy-protocol" }
baccy-transport = { path = "../crates/baccy-transport" }

[features]
default = []
